name: Portability CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Runtime (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
            platform: win32
            architecture: x64
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            architecture: x64
          - id: macos-x64
            runner: macos-15-intel
            platform: darwin
            architecture: x64
          - id: macos-arm64
            runner: macos-15
            platform: darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PORTABILITY_PROFILE: ${{ matrix.id }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_RUNNER: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.1
          architecture: ${{ matrix.architecture }}
          check-latest: false
          package-manager-cache: false

      - name: Verify host identity
        run: node scripts/write-portability-runner-evidence.mjs

      - name: Validate frozen P5 continuation and portability policy
        run: node scripts/validate-p5.mjs

      - name: Run portability tests
        if: ${{ matrix.platform != 'win32' }}
        run: node --test --test-concurrency=1 tests/portability/*.test.mjs

      - name: Run current Windows suite
        if: ${{ matrix.platform == 'win32' }}
        shell: pwsh
        run: |
          if (
            $env:SystemDrive -cne 'C:' -or
            $env:GITHUB_RUN_ID -notmatch '^\d+$' -or
            $env:GITHUB_RUN_ATTEMPT -notmatch '^\d+$'
          ) {
            throw 'Unsafe Windows test environment.'
          }
          $tempRoot = Join-Path $env:SystemDrive "p6-temp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $tempRoot) {
            throw 'Windows test root already exists.'
          }
          New-Item -ItemType Directory -Path $tempRoot -ErrorAction Stop | Out-Null
          $item = Get-Item -LiteralPath $tempRoot -Force
          if (-not $item.PSIsContainer -or ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) {
            throw 'Windows test root is not an ordinary directory.'
          }
          $env:TEMP = $tempRoot
          $env:TMP = $tempRoot
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE

      # Until now the unit suite ran on win32 only, so every POSIX-only path in state, job
      # control, git and argument handling was reviewed but never executed.
      #
      # The list is spelled out rather than reusing the package's test script. package.json
      # declares os: win32 and cpu: x64 -- frozen as product identity by downstream-identity --
      # so `npm ci` refuses to run here at all with EBADPLATFORM, and no dependency is needed
      # anyway: the only test wanting one is generate-app-server-types, which drives tsc from
      # node_modules and is a build concern the Windows leg covers. The portability tests keep
      # their own step above, which the frozen policy requires.
      #
      # These seven are the platform-neutral files. Four of the suite's twelve assert win32
      # directly -- broker-endpoint on named pipes, platform-policy on the supported tuple,
      # and commands and runtime through the integration fixtures -- and belong to the Windows
      # leg. Measured against the first run that got this far, not assumed.
      - name: Run current POSIX unit suite
        if: ${{ matrix.platform != 'win32' }}
        run: |
          node --test --test-concurrency=1 \
            tests/args.test.mjs tests/bump-version.test.mjs tests/git.test.mjs \
            tests/job-control.test.mjs tests/process.test.mjs tests/render.test.mjs \
            tests/state.test.mjs

      # All five baseline suites, which had no trigger anywhere until their assertions were
      # brought to the facts they describe. Windows-only because they pin this host:
      # p4-contract-baseline and p5-matrix-profile require win32/x64 on the exact Node above,
      # p5-windows-resource drives taskkill, and p3-security-baseline exercises the PowerShell
      # tool installer.
      #
      # One line on purpose: this leg runs under pwsh, where a trailing backslash is not a line
      # continuation, so the wrapped form the POSIX step uses passes `\` as an argument.
      - name: Run baseline suites
        if: ${{ matrix.platform == 'win32' }}
        run: node --test --test-concurrency=1 tests/downstream-identity.test.mjs tests/p3-security-baseline.test.mjs tests/p4-contract-baseline.test.mjs tests/p5-matrix-profile.test.mjs tests/p5-windows-resource.test.mjs

      - name: Validate the P3 repository baseline
        if: ${{ matrix.platform == 'win32' }}
        run: node scripts/validate-p3.mjs

      - name: Verify clean source
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- .

  security:
    name: Security
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Acquire exact local security tools
        shell: pwsh
        run: |
          $environmentNames = @{
            actionlint = 'P5_ACTIONLINT_PATH'
            zizmor = 'P5_ZIZMOR_PATH'
            'osv-scanner' = 'P5_OSV_SCANNER_PATH'
            gitleaks = 'P5_GITLEAKS_PATH'
          }
          foreach ($toolId in @('actionlint', 'zizmor', 'osv-scanner', 'gitleaks')) {
            $toolPath = ./scripts/install-p3-tool.ps1 `
              -ToolId $toolId `
              -DestinationRoot (Join-Path $env:RUNNER_TEMP 'p6-security-tools')
            Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $toolPath)
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($environmentNames[$toolId])=$toolPath"
          }

      - name: Lint workflow
        run: actionlint.exe

      - name: Audit workflow security
        run: zizmor.exe --offline --persona pedantic --strict-collection .github/workflows

      - name: Scan dependency lockfile
        run: osv-scanner.exe scan --lockfile package-lock.json

      - name: Scan repository for secrets
        run: gitleaks.exe dir --redact --no-banner .

      - name: Verify clean source
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- .

  dependency-review:
    name: Dependency review
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Verify clean source
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- .

  portability:
    name: Portability CI
    if: ${{ always() }}
    needs: [runtime, security, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all native runtime profiles
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
